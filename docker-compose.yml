version: '3.8'

services:
  backend-app:
    build:
      context: ./backend/mon-projet-api
      dockerfile: Dockerfile
    volumes:
      - ./backend/mon-projet-api:/var/www/html
    working_dir: /var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -c "php artisan migrate --force
      && php artisan db:seed --force
      && php-fpm"
    networks:
      - appnet

  backend-nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend/mon-projet-api:/var/www/html
      - ./backend/mon-projet-api/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend-app
    networks:
      - appnet

  postgres:
    image: postgis/postgis:15-3.4
    container_name: laravel_postgres
    environment:
      POSTGRES_DB: laravel_db
      POSTGRES_USER: laravel
      POSTGRES_PASSWORD: secret
    ports:
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - appnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laravel -d laravel_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  tileserver:
    image: maptiler/tileserver-gl
    container_name: offline_tileserver
    volumes:
      - ./backend/mon-projet-api/tileserver/data:/data
    ports:
      - "8081:8080"
    networks:
      - appnet
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - appnet

networks:
  appnet:
    driver: bridge

volumes:
  pg_data:
